name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: 2Aronggg
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23f80176&color_dots=%23fff0f5,%23ffb3d9,%23ff66b2,%23f80176,%23b8004f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23f80176
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
