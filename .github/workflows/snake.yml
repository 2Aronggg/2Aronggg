
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: 2Aronggg
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff8fab&color_dots=fff0f5,ffd6e8,ffb3d1,ff8fab,d6336c
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=ff8fab
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


               
